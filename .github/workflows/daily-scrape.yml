name: Daily Wiki Scrape

on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC daily
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pick
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost/pick
      MEDIAWIKI_API_URL: https://prospecting.miraheze.org/w/api.php
      REDDIT_USER_AGENT: PICK/1.0 (Prospecting Information & Community Kit)

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Initialize database
        run: alembic upgrade head
      - name: Run wiki scraper
        run: python -m scripts.scraper
      - name: Run news scraper
        run: python -m scripts.news_scraper