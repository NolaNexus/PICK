name: Weekly Full Wiki Scrape

on:
  schedule:
    - cron: "0 4 * * 0"  # 04:00 UTC every Sunday
  workflow_dispatch:

jobs:
  full-scrape:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pick
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost/pick
      MEDIAWIKI_API_URL: https://prospecting.miraheze.org/w/api.php
      REDDIT_USER_AGENT: PICK/1.0 (Prospecting Information & Community Kit)
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Set up R
        run: sudo apt-get update && sudo apt-get install -y r-base
      - name: Initialize database
        run: alembic upgrade head
      - name: Run full wiki scraper
        run: python -m scripts.scraper --full
      - name: Run news scraper (if Reddit credentials configured)
        if: env.REDDIT_CLIENT_ID != '' && env.REDDIT_CLIENT_SECRET != ''
        run: python -m scripts.news_scraper

      - name: Seed formulas
        run: python -m scripts.seed_formulas