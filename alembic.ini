[alembic]
script_location = alembic
template = alembic/templates
review_comments = "no"
revision_environment = true
branch_labels = None
datetime_format = %%Y-%%m-%%d %%H:%%M:%%S

sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost/pick

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
