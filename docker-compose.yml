services:
  db:
    image: postgres:16
    container_name: pick-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pick
      POSTGRES_PASSWORD: pick
      POSTGRES_DB: pick
    ports:
      - "5432:5432"
    volumes:
      - pick_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pick -d pick"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pick_db_data:
