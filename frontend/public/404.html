<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PICK — Prospecting Information &amp; Community Kit</title>
    <script>
      // Single-page application fallback: redirect all 404s to index.html
      // so React Router can handle the route client-side.
      (function () {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        if (path !== "/index.html" && !path.startsWith("/assets/")) {
          window.location.replace("/index.html" + search + hash);
        }
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p>Please enable JavaScript to use this application.</p>
    </noscript>
    <div id="root"></div>
  </body>
</html>
