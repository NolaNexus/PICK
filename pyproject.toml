[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pick"
version = "0.1.0"
description = "Prospecting Information & Community Kit — self-updating wiki replacement backend"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PICK Contributors" }]
# The runtime dependencies are read from requirements.txt, which is the file
# everything installs from. Two lists of the same packages is two lists that
# can disagree, and nothing would notice.
dynamic = ["dependencies"]

[project.scripts]
pick-scraper = "scripts.scraper:run"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scrapers*", "scripts*"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true
warn_unused_ignores = false
# Legacy SQLAlchemy 1.x-style Column declarations and parser dicts are not
# fully typed yet. Keep mypy useful for imports/name errors while the codebase
# migrates incrementally.
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "index",
    "misc",
    "var-annotated",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that hit the live wiki or require a database",
]
addopts = "-v --cov=app --cov=scrapers --cov=scripts --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["app", "scrapers", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"