[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pick"
version = "0.1.0"
description = "Prospecting Information & Community Kit — self-updating wiki replacement backend"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PICK Contributors" }]
# The runtime dependencies are read from requirements.txt, which is the file
# everything installs from. Two lists of the same packages is two lists that
# can disagree, and nothing would notice.
dynamic = ["dependencies"]

[project.scripts]
pick-scraper = "scripts.scraper:run"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "scrapers*", "scripts*"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true
warn_unused_ignores = false
# The error codes that used to be disabled here are all enabled now. They were
# off because the models used the legacy SQLAlchemy 1.x Column() form, which
# left every query result untyped, and because the parsers returned
# dict[str, Any]. Both are fixed, so the typecheck catches a wrong type, a
# wrong attribute and a wrong call again.
#
# These seven codes (arg-type, assignment, attr-defined, call-arg, index,
# misc, var-annotated) are on by default in mypy 2.4; the disable_error_code
# list that used to switch them off was removed. Do not re-add it.
#
# This is not strict mode. `mypy --strict app/ scrapers/ scripts/` reports
# 42 errors, mostly type-arg and no-untyped-def. That is the backlog.
#
# To see what a single code would catch, run:
#     mypy app/ scrapers/ scripts/ --enable-error-code=<code>
# For a code that is already on the flag changes nothing; it inspects rather
# than enables.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that hit the live wiki or require a database",
]
addopts = "-v --cov=app --cov=scrapers --cov=scripts --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["app", "scrapers", "scripts"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"