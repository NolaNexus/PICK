[project]
name = "pick-pipeline"
version = "0.1.0"
description = "MediaWiki -> PostgreSQL (raw/parsed) -> JSON -> Astro / Pages"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mwclient>=1.2",
    "mwparserfromhell>=0.7",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.2",
    "click>=8.1",
    "pandas>=2.2",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.17",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
