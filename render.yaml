services:
  - type: web
    name: pick-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health/health/ready
    # Deploys are triggered by .github/workflows/deploy-api.yml after CI passes.
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pick-db
          property: connectionString
      - key: MEDIAWIKI_API_URL
        value: https://prospecting.miraheze.org/w/api.php
      - key: USER_AGENT
        value: PICK/1.0 (Prospecting Information & Community Kit)
      - key: WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: '["*"]'

  - type: cron
    name: pick-scrape-daily
    runtime: docker
    plan: starter
    schedule: "0 */6 * * *"
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "alembic upgrade head && python -m scripts.scraper"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pick-db
          property: connectionString
      - key: MEDIAWIKI_API_URL
        value: https://prospecting.miraheze.org/w/api.php
      - key: USER_AGENT
        value: PICK/1.0 (Prospecting Information & Community Kit)

  - type: cron
    name: pick-scrape-weekly
    runtime: docker
    plan: starter
    schedule: "0 4 * * 0"
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "alembic upgrade head && python -m scripts.scraper --full"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pick-db
          property: connectionString
      - key: MEDIAWIKI_API_URL
        value: https://prospecting.miraheze.org/w/api.php
      - key: USER_AGENT
        value: PICK/1.0 (Prospecting Information & Community Kit)

databases:
  - name: pick-db
    databaseName: pick
    plan: free
    postgresMajorVersion: "16"
